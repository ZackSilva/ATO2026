[project]
name = "slabtrak-api"
version = "0.1.0.dev3"
description = "Private SlabTrak collection API"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.149.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.5",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "pydantic-settings==2.16.0",
  "argon2-cffi==25.1.0",
  "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.1", "pip-audit==2.10.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["slabtrak", "tests"]

[tool.vercel]
entrypoint = "main:app"
