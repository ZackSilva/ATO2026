name: SlabTrak checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    # These credentials belong only to this disposable CI database.
    env:
      TEST_DATABASE_URL: postgresql+psycopg://slabtrak_app:ci-test-only@127.0.0.1:55432/slabtrak_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://slabtrak_admin:ci-admin-test-only@127.0.0.1:55432/slabtrak_test
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: slabtrak_admin
          POSTGRES_PASSWORD: ci-admin-test-only
          POSTGRES_DB: slabtrak_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U slabtrak_admin -d slabtrak_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install --require-hashes -r apps/api/requirements-dev.lock
      - name: Prepare isolated runtime database role
        run: |
          docker exec -i '${{ job.services.postgres.id }}' psql -U slabtrak_admin -d slabtrak_test <<'SQL'
          CREATE ROLE slabtrak_app LOGIN PASSWORD 'ci-test-only';
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
      - name: Python lint and integration checks
        run: |
          apps/api/.venv/bin/ruff check --config apps/api/pyproject.toml apps/api scripts
          cd apps/api
          .venv/bin/python -m pytest -q
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Frontend checks and production build
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Install CI browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser journeys
        run: PYTHONPATH=apps/api apps/api/.venv/bin/python scripts/check_browser.py
